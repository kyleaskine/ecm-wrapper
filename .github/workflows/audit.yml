name: Dependency Audit

on:
  push:
    branches: [ main ]
    paths:
      - 'server/requirements.txt'
      - '.github/workflows/audit.yml'
  pull_request:
    paths:
      - 'server/requirements.txt'
      - '.github/workflows/audit.yml'
  # New advisories get published without us pushing any code, so poll weekly.
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Must match server/docker/Dockerfile: the dependency tree is resolved
    # per Python version, so auditing on a different one audits a set that is
    # not necessarily the deployed set.
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install pip-audit
      run: pip install pip-audit==2.9.0

    # Audits the pinned set without installing it (--no-deps would hide
    # transitive vulns, so let pip-audit resolve the full tree).
    #
    # There is no ignore list: the set is currently clean, so any finding
    # here is new. If one has to be deferred, add it as an explicit
    # --ignore-vuln with a comment saying why and what clears it, rather
    # than letting this step go red and be ignored by habit.
    # --strict: without it, a dependency whose metadata cannot be collected is
    # skipped with a warning and the job still exits 0 -- a silent hole in the
    # gate.
    - name: Audit server requirements
      run: |
        pip-audit \
          --requirement server/requirements.txt \
          --progress-spinner off \
          --desc on \
          --strict
