[mypy]
# sqlalchemy plugin removed: deprecated in SQLAlchemy 2.0 and unnecessary for
# 2.0-style Mapped[] models (all models in this repo use that style).
plugins = pydantic.mypy
ignore_missing_imports = True

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True
